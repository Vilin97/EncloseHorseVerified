name: External ASP reference benchmarks
on:
  push:
    branches: [asp-reference]
  pull_request:
    paths:
      - scripts/solve_asp.py
      - scripts/test_asp.py
      - scripts/requirements-asp.txt
      - data/daily-levels.json
      - .github/workflows/asp-reference.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asp-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-asp.txt
      - name: Differential tests and three real daily levels
        run: |
          set -o pipefail
          python scripts/test_asp.py --daily --daily-timeout 180 --json-output /tmp/asp-results.json 2>&1 | tee /tmp/asp-reference.log
      - name: Expose reference results in check annotations
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def escaped(text):
              return text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          path = Path('/tmp/asp-results.json')
          if path.exists():
              for result in json.loads(path.read_text()):
                  summary = {key: result[key] for key in ('id','status','score','walls','total_seconds','search_exhausted','interrupted','lean_verified')}
                  kind = 'notice' if result['status'] == 'optimal' else 'error'
                  print(f'::{kind} title=External ASP reference::' + escaped(json.dumps(summary)))
          else:
              log = Path('/tmp/asp-reference.log')
              text = log.read_text()[-12000:] if log.exists() else 'ASP test step produced no report'
              print('::error title=External ASP reference failed::' + escaped(text))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asp-reference-results
          path: |
            /tmp/asp-reference.log
            /tmp/asp-results.json
