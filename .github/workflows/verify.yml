name: Verify Lean and playable infoview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and check kernel proofs
        run: |
          set -o pipefail
          {
            lean --version
            lake build encloseHorse EncloseHorseVerified
            while IFS= read -r file; do
              module="${file%.lean}"
              module="${module//\//.}"
              lake build "$module" || exit 1
            done < <(find EncloseHorseVerified -name '*.lean' | sort)
            for file in Tests/*.lean; do lake env lean "$file" || exit 1; done
            lake env lean Demo.lean
          } 2>&1 | tee /tmp/enclose-lean-checks.log
      - name: Publish compilation transcript
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const transcript = fs.existsSync('/tmp/enclose-lean-checks.log')
              ? fs.readFileSync('/tmp/enclose-lean-checks.log', 'utf8')
              : 'Compilation step did not start.';
            const content = Buffer.from('Head: ' + context.sha + '\nRun: ' + context.runId + '\n\n' + transcript).toString('base64');
            for (let attempt = 0; attempt < 4; attempt++) {
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner, repo: context.repo.repo,
                  branch: 'ci-reports', path: 'reports/' + context.runId + '.txt',
                  message: 'Record compiler output for run ' + context.runId,
                  content
                });
                break;
              } catch (e) { if (attempt === 3) throw e; }
            }
      - name: Real-level solver and independent exhaustive checks
        run: |
          lake exe encloseHorse --json > /tmp/enclose-results.json
          cat /tmp/enclose-results.json
          python3 scripts/verify_fixtures.py --lean-json /tmp/enclose-results.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Audit small hardness reduction boards
        run: node scripts/audit_hardness_reduction.mjs
      - name: Install UI test dependencies
        working-directory: tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Play in the real infoview and capture screenshots
        working-directory: tools
        run: npm run screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infoview-screenshots
          path: docs/screenshots/
          if-no-files-found: ignore
      - name: Publish reproducible screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Capture tested playable Lean infoview screenshots"
            git push
          fi
